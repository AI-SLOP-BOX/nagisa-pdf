[package]
name = "nagisa_pdf"
version = "1.0.0"
description = "Professional-grade high-performance PDF editor with 100% local processing"
authors = ["Nagisa PDF"]
edition = "2021"
license = "MIT"
default-run = "nagisa"

[lib]
name = "nagisa_pdf"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nagisa"
path = "src/main.rs"

[[bin]]
name = "nagisa-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["relax-sign-encoding", "relax-void-encoding", "disable-encoding-assertions"] }

[target.'cfg(unix)'.dependencies]
# #42: タイムアウト SIGKILL 用 (run_command_with_timeout)
libc = "0.2"

# PDF manipulation
lopdf = "0.35"
flate2 = "1"

# Image processing
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"

# OCR - using tesseract CLI

# EPUB creation
epub-builder = "0.7"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
tao = { path = "../tao-patch" }
